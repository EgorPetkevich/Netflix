name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26

    defaults:
      run:
        working-directory: NetflixProject

    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: |
          brew install swiftlint
          brew install swiftgen

      - name: Install Ruby dependencies
        run: bundle install

      - name: Fix TCA package URL
        run: |
          sed -i '' \
            's|https://github.com/pointfreeco/swift-composable-architecture?tab=readme-ov-file|https://github.com/pointfreeco/swift-composable-architecture.git|g' \
            NetflixProject.xcodeproj/project.pbxproj

          grep -n "swift-composable-architecture" \
            NetflixProject.xcodeproj/project.pbxproj

      - name: Run Fastlane CI
        run: bundle exec fastlane ci

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-test-output
          path: NetflixProject/fastlane/test_output
